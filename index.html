<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady Hands · Operator</title>
<style>
:root{
  --bg:#f6f7f4; --card:#ffffff; --card2:#f0f2ed; --card3:#e6e9e0; --ink:#1c211d; --ink2:#5c665c; --ink3:#94a091;
  --accent:#2c6e68; --accent-tint:#e3f0ed; --warn:#b1503e; --warn-tint:#fbe8e3; --good:#2c6e68;
  --c-block:#2c6e68; --c-block-tint:#e3f0ed;
  --c-probe:#6d4f8a; --c-probe-tint:#efe7f5;
  --c-assess:#a06a20; --c-assess-tint:#f6ead4;
  --c-break:#3c7a4d; --c-break-tint:#e6f2e8;
  --c-flow:#5c665c; --c-flow-tint:#eef0eb;
  --shadow:0 1px 2px rgba(28,33,29,.04), 0 6px 16px rgba(28,33,29,.05);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#f6f7f4; --card:#ffffff; --card2:#f0f2ed; --card3:#e6e9e0; --ink:#1c211d; --ink2:#5c665c; --ink3:#94a091;
    --accent:#2c6e68; --accent-tint:#e3f0ed; --warn:#b1503e; --warn-tint:#fbe8e3;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;}
.wrap{max-width:520px; margin:0 auto; padding:0 16px 40px;}

header{position:sticky; top:0; z-index:20; background:var(--bg); padding-top:calc(env(safe-area-inset-top,0px) + 14px);}
.hd-row{display:flex; align-items:center; gap:8px; padding:0 16px 14px; max-width:520px; margin:0 auto;}
.hd-title{flex:1; min-width:0;}
.hd-title h1{margin:0; font-size:18px; font-weight:700; line-height:1.2;}
.hd-code{border:none; background:none; font-size:12px; color:var(--ink3); padding:2px 0; width:100%;}
.hd-clock{text-align:right; font-family:var(--mono);}
.hd-clock .n{font-size:20px; font-weight:600;}
.hd-clock .l{font-size:9px; color:var(--ink3); letter-spacing:.06em;}
.iconbtn{width:36px; height:36px; border-radius:50%; border:none; background:var(--card2);
  color:var(--ink2); font-size:16px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}

.strip{display:flex; gap:6px; overflow-x:auto; padding:2px 16px 16px; margin:0 -16px; scrollbar-width:none;}
.strip::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:12px; font-weight:600; background:var(--card2); color:var(--ink3); border:none;}
.chip.done{background:var(--accent); color:#fff;}
.chip.now{background:var(--card); color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset;}

.now{background:var(--card); border-radius:20px; padding:20px; box-shadow:var(--shadow); margin-top:2px;}
.now .tag{font-family:var(--mono); font-size:10px; letter-spacing:.04em; padding:3px 9px; border-radius:20px; display:inline-block;}
.now .tag.steady{background:var(--c-block-tint); color:var(--c-block);}
.now .tag.bumpy{background:var(--c-probe-tint); color:var(--c-probe);}
.now .tag.split{background:var(--c-assess-tint); color:var(--c-assess);}
.now .tag.watch{background:var(--c-break-tint); color:var(--c-break);}
.now .tag.check{background:var(--c-flow-tint); color:var(--c-flow);}
.now .tag.flow{background:var(--c-flow-tint); color:var(--c-flow);}
.now h2{font-size:24px; margin:10px 0 2px; font-weight:700;}
.now .sub{font-size:13.5px; color:var(--ink2); margin-bottom:14px;}

.trackwrap{background:var(--card2); border-radius:16px; overflow:hidden; margin-bottom:10px;}
canvas#track-canvas, canvas#demo-canvas, canvas#fig-canvas{width:100%; display:block;}
.zonebar{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--ink3); margin:-2px 2px 10px;}
.holdrow{margin-bottom:12px;}
.dragstrip{position:relative; height:54px; background:var(--card2); border-radius:27px; margin-bottom:6px; touch-action:none;}
.draghandle{position:absolute; top:3px; left:50%; width:48px; height:48px; border-radius:50%; background:var(--accent);
  transform:translateX(-50%); display:flex; align-items:center; justify-content:center; color:#fff; font-size:19px; transition:background .1s;}
.draghint{text-align:center; font-size:11px; color:var(--ink3); margin:0 0 12px;}
button.hold{font-size:24px; padding:18px; background:var(--card2); transition:transform .1s, background .1s;}
button.hold:active{background:var(--accent-tint); transform:scale(0.92);}
.splittask{display:flex; align-items:center; gap:10px; margin-bottom:14px; background:var(--card2); border-radius:14px; padding:10px 14px; transition:background .3s;}
.splittask.flash-ok{animation:flashOk .45s ease;}
.splittask.flash-bad{animation:flashBad .45s ease;}
@keyframes flashOk{0%{background:var(--c-block-tint);} 100%{background:var(--card2);}}
@keyframes flashBad{0%{background:var(--warn-tint);} 100%{background:var(--card2);}}
.split-q{font-family:var(--mono); font-size:18px; font-weight:700; min-width:64px;}
.split-score{font-family:var(--mono); font-size:12px; color:var(--ink3); margin-left:auto;}

.timerbig{font-family:var(--mono); font-size:44px; font-weight:600; text-align:center; margin:6px 0 2px; letter-spacing:.01em;}
.timertarget{text-align:center; font-size:11.5px; color:var(--ink3); margin-bottom:14px;}
.btnrow{display:flex; gap:8px; flex-wrap:wrap;}
button{font-family:var(--sans); font-size:15px; font-weight:600; border-radius:13px; border:none;
  background:var(--card2); color:var(--ink); padding:14px 16px; cursor:pointer; flex:1; min-height:50px;}
button.primary{background:var(--accent); color:#fff;}
button.warn{background:var(--warn-tint); color:var(--warn);}
button.ghost{background:transparent; color:var(--ink2);}
button:disabled{opacity:.35;}
button.small{flex:0 0 auto; padding:11px 14px; min-height:44px; font-size:14px;}

.grid9{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0 6px;}
.grid9 button{aspect-ratio:1.3; font-family:var(--mono); font-size:20px; background:var(--card2);}
.grid9 button.sel{background:var(--c-assess); color:#fff;}
.scalehint{display:flex; justify-content:space-between; font-size:11px; color:var(--ink3); margin-bottom:14px;}

.checklist label{display:flex; gap:10px; align-items:center; padding:10px 0; font-size:15px;}
.checklist input{width:20px; height:20px; flex:0 0 auto;}

.flash{height:120px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:700; font-size:16px; margin-bottom:14px; background:var(--card2); color:var(--ink3); transition:transform .15s;}
.flash.go{background:var(--good); color:#fff; font-size:22px; animation:breathe 1s ease-in-out infinite;}
.flash.early{background:var(--warn); color:#fff;}
.flash.watching{animation:breathe 2.4s ease-in-out infinite;}
.flash.hit{transform:scale(1.05); background:var(--good); color:#fff;}
@keyframes breathe{0%,100%{opacity:.85; transform:scale(1);} 50%{opacity:1; transform:scale(1.03);}}
.pvtstats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; font-family:var(--mono); font-size:11.5px;}
.pvtstats div{background:var(--card2); border-radius:11px; padding:9px 11px; color:var(--ink3);}
.pvtstats b{display:block; font-size:17px; margin-top:2px; color:var(--ink); font-family:var(--sans);}

.sumrow{display:flex; justify-content:space-between; font-size:14px; padding:8px 4px; border-radius:10px;}
.sumrow:nth-child(odd){background:var(--card2);}

.donelist{margin-top:18px;}
.dlrow{display:flex; align-items:center; gap:10px; padding:11px 10px; font-size:14px; border-radius:12px;}
.dlrow:nth-child(odd){background:var(--card2);}
.dlrow .ck{width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.dlrow .nm{flex:1;}
.dlrow .du{font-family:var(--mono); font-size:12px; color:var(--ink3); text-align:right;}

.logsec{margin-top:22px;}
.logsec summary{font-size:12px; color:var(--ink3); letter-spacing:.03em; cursor:pointer; padding:4px 0;}
.logline{font-family:var(--mono); font-size:11px; color:var(--ink2); padding:6px 10px; display:flex; gap:8px; border-radius:10px;}
.logline:nth-child(odd){background:var(--card2);}
.logline .t{color:var(--ink3); flex:0 0 auto;}
.empty{font-size:12.5px; color:var(--ink3); padding:8px 0;}

.screenhead{display:flex; align-items:center; gap:10px; margin:4px 0 14px;}
.screenhead h2{font-size:20px; margin:0; flex:1;}
.blurb{font-size:13.5px; color:var(--ink2); margin-bottom:16px; line-height:1.4;}

.beatlabel{font-family:var(--mono); font-size:11px; color:var(--ink3); letter-spacing:.04em; margin-bottom:6px;}

.figlegend{display:flex; gap:14px; font-size:12px; color:var(--ink2); margin:10px 0 4px; flex-wrap:wrap;}
.figlegend span{display:flex; align-items:center; gap:6px;}
.figlegend i{width:10px; height:10px; border-radius:50%; display:inline-block;}
.caption{font-size:13px; color:var(--ink2); margin-top:6px;}

.barcard{background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
.barcard h3{font-size:14px; margin:0 0 12px;}
.barrow{margin-bottom:10px;}
.barrow .lbl{display:flex; justify-content:space-between; font-size:12px; color:var(--ink2); margin-bottom:4px;}
.bartrack{background:var(--card2); border-radius:8px; height:14px; overflow:hidden;}
.barfill{height:100%; border-radius:8px;}
.tablewrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th,td{text-align:left; padding:7px 8px;}
tbody tr:nth-child(odd){background:var(--card2);}
th{color:var(--ink3); font-weight:600; font-size:11px;}

.sheetlist button{display:flex; width:100%; text-align:left; margin-bottom:8px; background:var(--card2);}
.sheetlist button:last-child{margin-bottom:0;}

.modal-bg{position:fixed; inset:0; background:rgba(20,24,20,.45); display:flex; align-items:flex-end; z-index:50;}
.modal-card{background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:22px; padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));}
.modal-card h3{margin:0 0 8px; font-size:17px;}
.modal-card p{font-size:14px; color:var(--ink2); line-height:1.5; margin:0 0 16px;}
[hidden]{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <div class="hd-title">
      <h1 id="hd-name">Steady Hands</h1>
      <div class="hd-code" id="hd-code-display">not started</div>
    </div>
    <div class="hd-clock"><div class="n" id="hd-elapsed">00:00</div><div class="l">ELAPSED</div></div>
    <button class="iconbtn" id="menu-btn" aria-label="Menu" title="Menu">⋯</button>
  </div>
  <div class="strip" id="strip"></div>
</header>

<div class="wrap">
  <div id="mainview">
    <div id="nowcard"></div>
    <div class="donelist" id="donelist"></div>
    <div class="logsec"><details><summary>Session log</summary><div id="log" style="margin-top:8px"></div></details></div>
  </div>
  <div id="otherview" hidden></div>
</div>

<input type="file" id="import-file" accept="application/json" hidden>
<input type="file" id="analyze-file" accept="application/json,.json,.csv,text/csv" multiple hidden>
<div class="modal-bg" id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";

/* ── Supabase project config ───────────────────────────────
   Fill these in with your project's values (Project Settings → API).
   The anon key is safe to ship in client code ONLY because Row Level
   Security policies restrict it to insert-only on `sessions` and
   write-only on the `session-data` storage bucket — see the setup
   notes shared alongside this file before deploying. */
const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';
let supabaseClient = null;
function getSupabase(){
  if(supabaseClient) return supabaseClient;
  if(typeof window.supabase==='undefined') return null;
  if(SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')) return null;
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ return null; }
  return supabaseClient;
}
/* One-way, client-side anonymization: the name is hashed and discarded —
   it is never written to S, localStorage, or sent anywhere. Same name
   always maps to the same ID, which is what makes it useful as an ID. */
async function anonymizeId(name){
  const norm=name.trim().toLowerCase().replace(/\s+/g,' ');
  const enc=new TextEncoder().encode('steady-hands-v1:'+norm);
  const buf=await crypto.subtle.digest('SHA-256', enc);
  const hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return 'P-'+hex.slice(0,8).toUpperCase();
}

/* ── movement profiles for the tracking task ───────────────
   Position error e drifts on its own (integrator, no natural
   restoring force) and is only brought back by holding a button. */
const PROFILES = {
  baseline:  {noiseSD:0.028, road:false, roadExtra:0,    pert:true, pertAmt:0.9, pertMin:12, pertMax:19, load:false, corrRate:1.7, control:'hold'},
  road:      {noiseSD:0.028, road:true,  roadExtra:0.05, pert:true, pertAmt:0.9, pertMin:12, pertMax:19, load:false, corrRate:2.2, control:'drag'},
  load:      {noiseSD:0.028, road:false, roadExtra:0,    pert:true, pertAmt:0.9, pertMin:12, pertMax:19, load:true,  corrRate:0,   control:'tap', nudge:0.5}
};

const STEPS = [
  {t:'action', title:'Start Session',     tag:'flow',  dur:0,    desc:'', profile:null},
  {t:'consent', title:'Consent',          tag:'flow',  dur:0,    desc:'', profile:null},
  {t:'timer',  title:'Baseline',          tag:'steady', dur:300,  desc:'Steady Hands — hold ◀▶ to correct, nothing else going on', profile:'baseline'},
  {t:'timer',  title:'Road Condition',    tag:'bumpy',  dur:300,  desc:'Bumpy Road — drag to steer through the jolts',  profile:'road'},
  {t:'timer',  title:'Cognitive Load',    tag:'split',  dur:300,  desc:'Split Focus — tap to nudge, while solving sums',         profile:'load'},
  {t:'kss',    title:'KSS',               tag:'check', dur:0,    desc:'Karolinska Sleepiness Scale — how sleepy do you feel right now? Tap the number that fits, then Confirm.', profile:null},
  {t:'pvt',    title:'PVT',               tag:'check', dur:180,  desc:'Quick Tap — tap the instant it turns green', profile:null},
  {t:'vigil',  title:'Fatigue Induction', tag:'watch', dur:1620, desc:'The Long Watch — no tracking, just tedium on purpose', profile:null},
  {t:'timer',  title:'Fatigued Baseline', tag:'steady', dur:300,  desc:'Steady Hands again, now tired — compare to before', profile:'baseline'},
  {t:'timer',  title:'Fatigued Road',     tag:'bumpy',  dur:300,  desc:'Bumpy Road again, now tired — compare to before',  profile:'road'},
  {t:'timer',  title:'Break',             tag:'flow',  dur:300,  desc:'Seated, no task', profile:null},
  {t:'action', title:'Finish Session',    tag:'flow',  dur:0,    desc:'', profile:null}
];
const TAGLABEL = {steady:'STEADY HANDS', bumpy:'BUMPY ROAD', split:'SPLIT FOCUS', watch:'LONG WATCH', check:'CHECK', flow:'—'};

let S = { code:'', current:0, startedAt:null, steps: STEPS.map(()=>({status:'locked', startedAt:null, endedAt:null, value:null})), log:[], saveAttempted:false };
let tickHandle=null;
let uiView='main';

/* runtime-only state for the running tracking task — never persisted */
let engineRuntime={}, engineInterval=null, splitInterval=null;
let holdDir={left:false, right:false};
let dragValue=0;

function nowISO(){ return new Date().toISOString(); }
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0 ? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') : String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cssvar(name){ try{ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }catch(e){ return '#888'; } }
function save(){ try{ localStorage.setItem('sh_operator_v9', JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const raw=localStorage.getItem('sh_operator_v9'); if(!raw) return;
    const rec=JSON.parse(raw); if(rec && Array.isArray(rec.steps) && rec.steps.length===STEPS.length) S=rec;
  }catch(e){}
}
function log(msg){ S.log.push({at:nowISO(), msg}); save(); renderLog(); }

async function saveFile(filename, text, mime){
  if(window.claude && typeof window.claude.use==='function'){
    /* Running inside the claude.ai viewer: this is the ONLY path that can
       actually save a file here. The blob+anchor trick below is inert on
       a published page, so it must never be used as a silent fallback —
       that was the bug: it looked like it worked but saved nothing. */
    try{
      const downloads = await window.claude.use('downloads');
      if(!downloads) return {ok:false, reason:'Downloads aren\u2019t available in this view.'};
      await downloads.save({filename, data:text});
      return {ok:true};
    }catch(e){
      return {ok:false, reason:'The save prompt was declined or failed. Tap the ⬇ button again and choose Save/Allow when your browser asks.'};
    }
  }
  /* No window.claude → this is a plain local file open in a normal
     browser (not the claude.ai sandbox), where the blob+anchor download
     genuinely works. */
  try{
    const blob=new Blob([text], {type:mime||'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
    return {ok:true};
  }catch(e){ return {ok:false, reason:'Your browser blocked the download.'}; }
}
function sessionSummaryText(){
  const lines=[ 'Steady Hands session — '+(S.code||'no code'), 'Finished '+new Date().toLocaleString(), '' ];
  STEPS.forEach((s,idx)=>{
    const st=S.steps[idx]; if(st.status!=='done') return;
    let extra='';
    if(st.value && st.value.sdlp!=null) extra=' — SDLP '+st.value.sdlp+', '+st.value.pertCount+' bump(s)';
    else if(st.value && st.value.medianRT!=null) extra=' — median RT '+st.value.medianRT+'ms, '+st.value.lapses+' lapse(s)';
    else if(st.value && st.value.hits!=null) extra=' — '+st.value.hits+' hit(s), best streak '+(st.value.bestStreak||0);
    else if(typeof st.value==='number') extra=' — KSS '+st.value;
    lines.push(s.title+extra);
  });
  return lines.join('\n');
}
/* Checks every step actually finished and carries the data it should,
   and that the total run time looks like a genuine 60-minute session
   (a little slack either side for real-world timer drift). */
function integrityCheck(){
  const missing = STEPS.filter((s,idx)=>{
    const st=S.steps[idx];
    if(st.status!=='done') return true;
    if(s.profile && !st.value) return true;
    if(s.t==='kss' && typeof st.value!=='number') return true;
    if(s.t==='pvt' && !st.value) return true;
    if(s.t==='vigil' && !st.value) return true;
    return false;
  }).map(s=>s.title);
  const elapsedSec = S.startedAt ? (Date.now()-new Date(S.startedAt).getTime())/1000 : 0;
  const durationOk = elapsedSec>=3300 && elapsedSec<=4500; /* 55–75 min */
  if(!durationOk) missing.push('session duration ('+fmtClock(elapsedSec)+', expected ~60:00)');
  const doneCount=S.steps.filter(s=>s.status==='done').length;
  return { ok: missing.length===0, missing, elapsedSec, doneCount, total: STEPS.length };
}
/* ── Direct email, no backend required ─────────────────────
   Two free Web3Forms access keys, one per recipient (the free
   tier allows one recipient per key). Get a key at web3forms.com
   by entering each address — no account needed. The full session
   JSON goes in the email body as text, not as an attachment
   (attachments are a paid Web3Forms feature, and this avoids the
   "no file attached" failure mode entirely). */
const WEB3FORMS_ACCESS_KEYS = [
  '3101e243-ec20-49c7-969c-7445a1c68c31', // arjunryan13@gmail.com
  'YOUR-WEB3FORMS-KEY-FOR-samrudhimahadik2002@gmail.com'
];
async function emailSessionData(check){
  const keys = WEB3FORMS_ACCESS_KEYS.filter(k=>k && !k.startsWith('YOUR-'));
  if(!keys.length) return {attempted:false, okCount:0, total:0};
  const subject = 'Steady Hands session — '+(S.code||'no code')+(check.ok?' (complete)':' (INCOMPLETE)');
  const message = sessionSummaryText()
    + '\n\nMissing/flagged: '+(check.missing.length?check.missing.join(', '):'none')
    + '\n\n--- full session data (JSON) ---\n' + JSON.stringify(S);
  const results = await Promise.all(keys.map(key=>
    fetch('https://api.web3forms.com/submit', {
      method:'POST',
      headers:{'Content-Type':'application/json', Accept:'application/json'},
      body: JSON.stringify({ access_key:key, subject, from_name:'Steady Hands operator app', message })
    }).then(r=>r.ok).catch(()=>false)
  ));
  return { attempted:true, okCount: results.filter(Boolean).length, total: keys.length };
}
/* Runs once, automatically, when the participant reaches the last screen.
   No upload or email step for the PARTICIPANT — the app sends the data
   itself, straight to the team's inboxes (and to Supabase too, if that's
   also configured on this build). */
async function finishSessionAutomatically(){
  const statusEl=document.getElementById('finish-status');
  const check=integrityCheck();
  const emailResult = await emailSessionData(check);
  const client=getSupabase();
  let supaOk=null, supaMsg='';
  if(client){
    try{
      const filename=(S.code||'session')+'-'+Date.now()+'.json';
      const { error: upErr } = await client.storage.from('session-data')
        .upload(filename, new Blob([JSON.stringify(S)], {type:'application/json'}));
      const { error: dbErr } = await client.from('sessions').insert({
        participant_id: S.code || 'unknown', started_at: S.startedAt, ended_at: nowISO(),
        completed: check.ok, steps_completed: check.doneCount, steps_total: check.total,
        missing: check.missing, elapsed_seconds: Math.round(check.elapsedSec),
        session_json: S, file_name: filename
      });
      supaOk = !upErr && !dbErr;
      supaMsg = (upErr&&upErr.message)||(dbErr&&dbErr.message)||'';
    }catch(e){ supaOk=false; supaMsg=e.message||String(e); }
  }

  if(!emailResult.attempted && client===null){
    if(statusEl) statusEl.innerHTML='<b>Not saved automatically.</b> No email keys or Supabase are configured on this build — use ⬇ <b>Save session file</b> in the menu and send it to the team.';
    log('Auto-save skipped — nothing configured on this build');
    return;
  }
  const emailLine = emailResult.attempted
    ? (emailResult.okCount===emailResult.total
        ? 'Emailed to '+emailResult.okCount+' address'+(emailResult.okCount===1?'':'es')+'.'
        : 'Emailed '+emailResult.okCount+'/'+emailResult.total+' address(es) — one may have failed.')
    : '';
  const supaLine = client ? (supaOk ? 'Also saved to Supabase.' : 'Supabase save failed'+(supaMsg?' — '+esc(supaMsg):'')+'.') : '';
  const failed = (emailResult.attempted && emailResult.okCount===0) && (client && !supaOk);
  if(statusEl) statusEl.innerHTML = failed
    ? '<b>Save failed.</b> Please tell the team and keep this tab open — or use ⬇ Save session file in the menu.'
    : (check.ok ? '<b>Session complete.</b> ' : '<b>Session saved, but incomplete</b> — '+esc(check.missing.join(', '))+'. ')
      + esc(emailLine) + (supaLine?' '+esc(supaLine):'')
      + (check.ok ? ' Thank you — you can close this tab.' : ' Please tell the team.');
  log('Finish: '+emailLine+' '+supaLine+(check.ok?' (complete)':' (incomplete: '+check.missing.join(', ')+')'));
}
function exportSession(){
  const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const filename='steadyhands_'+(S.code||'session')+'_'+stamp+'.json';
  return saveFile(filename, JSON.stringify(S,null,2), 'application/json').then(res=>{
    if(res.ok){ log('Session file saved'); }
    else{
      log('Save failed — '+res.reason);
      openModal('<h3>Could not save</h3><p>'+esc(res.reason)+'</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      const b=document.getElementById('m-close'); if(b) b.onclick=closeModal;
    }
    return res.ok;
  });
}
function importSessionFromText(text){
  try{
    const rec=JSON.parse(text);
    if(!rec || !Array.isArray(rec.steps) || rec.steps.length!==STEPS.length) throw new Error('shape');
    S=rec;
    const firstOpen = S.steps.findIndex(s=>s.status!=='done');
    S.current = firstOpen<0 ? STEPS.length : firstOpen;
    if(firstOpen>=0) S.steps[firstOpen].status='current';
    save(); log('Session loaded from file'); renderApp();
    if(S.startedAt) startTicker();
  }catch(e){
    openModal('<h3>Could not load file</h3><p>That file does not look like a Steady Hands session export.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
    document.getElementById('m-close').onclick=closeModal;
  }
}

/* ── Steady Hand / Bumpy Road / Split Focus engine ──────────── */
function drawDot(canvas, e){
  if(!canvas) return;
  const w=canvas.clientWidth||300, h=90;
  if(canvas.width!==w) canvas.width=w;
  if(canvas.height!==h) canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const midY=h/2;
  const range=(w/2)-22;
  const x=w/2 + (e/3)*range;
  const off=Math.min(1, Math.abs(e)/2.2);
  /* soft target ring at center, no line */
  ctx.beginPath(); ctx.arc(w/2, midY, 22, 0, Math.PI*2);
  ctx.strokeStyle=cssvar('--card3'); ctx.lineWidth=6; ctx.stroke();
  /* dot color shifts from accent (centered) to warn (off) */
  const c1=hexToRgb(cssvar('--accent')), c2=hexToRgb(cssvar('--warn'));
  const mix=c1.map((v,idx)=>Math.round(v+(c2[idx]-v)*off));
  const radius=13+off*3;
  ctx.beginPath(); ctx.arc(x, midY, radius, 0, Math.PI*2);
  ctx.fillStyle='rgb('+mix.join(',')+')'; ctx.fill();
}
function hexToRgb(hex){
  hex=(hex||'#2c6e68').replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
function ensureEngineBoundTo(i, step, st){
  if(!engineRuntime[i]){
    const p=PROFILES[step.profile];
    engineRuntime[i]={e:0, elapsed:0, nextPert:p.pertMin+Math.random()*(p.pertMax-p.pertMin), samples:[], bumps:[], inZone:0};
  }
  drawDot(document.getElementById('track-canvas'), engineRuntime[i].e);
  if(st.running){
    if(engineInterval) clearInterval(engineInterval);
    engineInterval=setInterval(()=>tickEngine(i, step), 50);
    if(PROFILES[step.profile].load) startSplit();
  } else {
    if(engineInterval){ clearInterval(engineInterval); engineInterval=null; }
    stopSplit();
    holdDir={left:false, right:false}; dragValue=0;
  }
}
function tickEngine(i, step){
  const rt=engineRuntime[i]; if(!rt) return;
  const p=PROFILES[step.profile], dt=0.05;
  const n=(Math.random()+Math.random()+Math.random()-1.5);
  rt.e += n*p.noiseSD;
  if(p.road) rt.e += (Math.random()-0.5)*p.roadExtra;
  if(p.control==='hold'){
    if(holdDir.left) rt.e -= p.corrRate*dt;
    if(holdDir.right) rt.e += p.corrRate*dt;
  } else if(p.control==='drag'){
    rt.e += dragValue*p.corrRate*dt;
  }
  if(p.pert){
    rt.nextPert -= dt;
    if(rt.nextPert<=0){
      const sgn=Math.random()<0.5?-1:1; rt.e+=sgn*p.pertAmt; rt.bumps.push(rt.elapsed);
      rt.nextPert=p.pertMin+Math.random()*(p.pertMax-p.pertMin);
      buzz(40);
      const bs=document.getElementById('bump-stat'); if(bs) bs.textContent=rt.bumps.length+' bump'+(rt.bumps.length===1?'':'s');
    }
  }
  rt.e=Math.max(-3, Math.min(3, rt.e));
  rt.elapsed+=dt;
  rt.samples.push(rt.e);
  if(Math.abs(rt.e)<0.5) rt.inZone=(rt.inZone||0)+1;
  drawDot(document.getElementById('track-canvas'), rt.e);
  if(rt.samples.length%10===0){
    const zs=document.getElementById('zone-stat');
    if(zs) zs.textContent='in zone '+Math.round(((rt.inZone||0)/rt.samples.length)*100)+'%';
  }
  if(p.road){
    const wrap=document.getElementById('trackwrap');
    if(wrap) wrap.style.transform='translate('+((Math.random()-0.5)*7).toFixed(1)+'px,'+((Math.random()-0.5)*4).toFixed(1)+'px)';
  }
}
function finalizeEngine(i){
  const rt=engineRuntime[i]; if(!rt || !rt.samples.length) return null;
  const n=rt.samples.length, mean=rt.samples.reduce((a,b)=>a+b,0)/n;
  let ss=0; rt.samples.forEach(v=>ss+=(v-mean)*(v-mean));
  return {sdlp:+Math.sqrt(ss/n).toFixed(3), pertCount:rt.bumps.length, samplesN:n};
}
function stopEngineFor(i){
  if(engineInterval){ clearInterval(engineInterval); engineInterval=null; }
  stopSplit();
  holdDir={left:false, right:false}; dragValue=0;
  delete engineRuntime[i];
}
function pauseCurrentEngine(){
  const i=S.current, step=STEPS[i];
  if(step && step.profile){
    const st=S.steps[i];
    if(st.running){ st.running=false; save(); }
    if(engineInterval){ clearInterval(engineInterval); engineInterval=null; }
    stopSplit();
    holdDir={left:false, right:false}; dragValue=0;
  }
}
/* Split Focus: simple arithmetic answered while still holding the tracking buttons */
function startSplit(){
  stopSplit();
  let hits=0, total=0, correctIsA0=true, answer=0;
  const qEl=document.getElementById('sp-q'), a0=document.getElementById('sp-a0'), a1=document.getElementById('sp-a1'), scoreEl=document.getElementById('sp-score');
  function next(){
    const x=1+Math.floor(Math.random()*9), y=1+Math.floor(Math.random()*9);
    const op=Math.random()<0.5?'+':'−';
    answer = op==='+' ? x+y : x-y;
    if(qEl) qEl.textContent=x+' '+op+' '+y;
    const wrong = answer + (Math.random()<0.5?1:-1)*(1+Math.floor(Math.random()*3));
    correctIsA0 = Math.random()<0.5;
    if(a0) a0.textContent = correctIsA0?answer:wrong;
    if(a1) a1.textContent = correctIsA0?wrong:answer;
  }
  function pick(isA0){
    const correct=(isA0 && correctIsA0)||(!isA0 && !correctIsA0);
    total++; if(correct) hits++;
    if(scoreEl) scoreEl.textContent=hits+'/'+total;
    const card=document.getElementById('splitcard');
    if(card){ card.classList.remove('flash-ok','flash-bad'); void card.offsetWidth; card.classList.add(correct?'flash-ok':'flash-bad'); }
    buzz(correct?20:60);
    next();
  }
  if(a0) a0.onclick=()=>pick(true);
  if(a1) a1.onclick=()=>pick(false);
  next(); splitInterval=setInterval(next,4000);
}
function stopSplit(){ if(splitInterval){ clearInterval(splitInterval); splitInterval=null; } }

/* Long Watch: slow, monotonous vigilance task — no tracking */
function wireVigil(i, st, step){
  const state={running:false, hits:0, misses:0, falseTaps:0, streak:0, best:0, armed:false, timeoutId:null, missTimer:null, deadline:0, endCheck:null};
  const flash=document.getElementById('vg-flash');
  function stats(){
    document.getElementById('vg-hits').textContent=state.hits;
    document.getElementById('vg-miss').textContent=state.misses;
    document.getElementById('vg-fs').textContent=state.falseTaps;
  }
  function armNext(){
    if(performance.now()>=state.deadline) return;
    flash.className='flash watching'; flash.textContent='Watching…'+(state.best?' · best streak '+state.best:'');
    const isi=6000+Math.random()*8000;
    state.timeoutId=setTimeout(()=>{
      if(performance.now()>=state.deadline) return;
      flash.className='flash go'; flash.textContent='TAP'; state.armed=true;
      state.missTimer=setTimeout(()=>{
        if(state.armed){ state.armed=false; state.streak=0; state.misses++; stats(); buzz(80); flash.className='flash'; flash.textContent='Missed'; armNext(); }
      },1500);
    }, isi);
  }
  flash.onclick=()=>{
    if(!state.running) return;
    if(state.armed){
      state.armed=false; clearTimeout(state.missTimer); state.hits++; state.streak++;
      state.best=Math.max(state.best, state.streak); stats(); buzz(25);
      flash.className='flash hit'; flash.textContent='Hit! streak '+state.streak;
      setTimeout(armNext, 500);
    } else { state.falseTaps++; state.streak=0; stats(); }
  };
  function finish(){
    if(state.endCheck) clearInterval(state.endCheck);
    clearTimeout(state.timeoutId); clearTimeout(state.missTimer);
    state.running=false;
    st.value={hits:state.hits, misses:state.misses, falseTaps:state.falseTaps, bestStreak:state.best};
    log(step.title+' finished — '+state.hits+' hit(s), '+state.misses+' miss(es), best streak '+state.best);
    completeStep(i);
  }
  state.running=true; state.deadline=performance.now()+step.dur*1000;
  if(!st.startedAt) st.startedAt=nowISO();
  log(step.title+' started automatically'); armNext();
  state.endCheck=setInterval(()=>{
    const remain=Math.max(0,(state.deadline-performance.now())/1000);
    const timeEl=document.getElementById('vg-time'); if(timeEl) timeEl.textContent=fmtClock(remain);
    if(remain<=0) finish();
  },1000);
}

function wirePanel(step, st, i){
  if(step.t==='action'){
    if(step.title==='Finish Session'){
      if(!S.saveAttempted){ S.saveAttempted=true; save(); finishSessionAutomatically(); }
    } else {
      const nameInput=document.getElementById('p-name'), startBtn=document.getElementById('b-action');
      nameInput.addEventListener('input', ()=>{ startBtn.disabled = nameInput.value.trim().length===0; });
      nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && !startBtn.disabled) startBtn.click(); });
      startBtn.onclick=async ()=>{
        const name=nameInput.value.trim();
        if(!name) return;
        startBtn.disabled=true; startBtn.textContent='Assigning ID…';
        const id=await anonymizeId(name);
        S.code=id;
        const codeDisp=document.getElementById('hd-code-display'); if(codeDisp) codeDisp.textContent=id;
        S.startedAt=S.startedAt||nowISO(); log('Session started — '+id); startTicker(); completeStep(i);
      };
    }
  }
  if(step.t==='consent'){
    const boxes=['c1','c2','c3'].map(id=>document.getElementById(id));
    const cont=document.getElementById('b-continue');
    boxes.forEach(b=>b.onchange=()=>{ cont.disabled=!boxes.every(x=>x.checked); });
    cont.onclick=()=>{ log('Consent confirmed'); completeStep(i); };
    document.getElementById('b-withdraw').onclick=()=>{
      openModal('<h3>Withdraw?</h3><p>Ends the session now.</p><div class="btnrow"><button class="warn" id="m-yes">Withdraw</button><button class="ghost" id="m-no">Cancel</button></div>');
      document.getElementById('m-no').onclick=closeModal;
      document.getElementById('m-yes').onclick=()=>{ log('Withdrew at consent'); closeModal(); };
    };
  }
  if(step.t==='timer'){
    if(st.remaining==null) st.remaining=step.dur;
    if(!st.running){
      st.running=true;
      if(!st.startedAt) st.startedAt=nowISO();
      log(step.title+' started automatically');
      save();
    }
    if(step.profile){
      const p=PROFILES[step.profile];
      if(p.control==='hold'){
        const bL=document.getElementById('hold-left'), bR=document.getElementById('hold-right');
        const down=d=>e=>{ e.preventDefault(); holdDir[d]=true; };
        const up=d=>()=>{ holdDir[d]=false; };
        ['pointerdown','touchstart'].forEach(ev=>bL.addEventListener(ev, down('left'), {passive:false}));
        ['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>bL.addEventListener(ev, up('left')));
        ['pointerdown','touchstart'].forEach(ev=>bR.addEventListener(ev, down('right'), {passive:false}));
        ['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>bR.addEventListener(ev, up('right')));
      } else if(p.control==='drag'){
        const strip=document.getElementById('dragstrip'), handle=document.getElementById('draghandle');
        let dragging=false;
        const setFromX=x=>{
          const rect=strip.getBoundingClientRect();
          const rel=Math.max(0, Math.min(1, (x-rect.left)/rect.width));
          dragValue=(rel-0.5)*2;
          handle.style.left=(rel*100)+'%';
        };
        strip.addEventListener('pointerdown', e=>{ dragging=true; strip.setPointerCapture(e.pointerId); setFromX(e.clientX); });
        strip.addEventListener('pointermove', e=>{ if(dragging) setFromX(e.clientX); });
        ['pointerup','pointercancel','pointerleave'].forEach(ev=>strip.addEventListener(ev, ()=>{ dragging=false; dragValue=0; handle.style.left='50%'; }));
      } else if(p.control==='tap'){
        const tl=document.getElementById('tap-left'), tr=document.getElementById('tap-right');
        const nudge=dir=>{
          const rt=engineRuntime[i]; if(!rt) return;
          rt.e=Math.max(-3, Math.min(3, rt.e + dir*p.nudge));
          buzz(15);
          drawDot(document.getElementById('track-canvas'), rt.e);
        };
        tl.onclick=()=>nudge(-1);
        tr.onclick=()=>nudge(1);
      }
    }
  }
  if(step.t==='kss'){
    let picked=null;
    document.querySelectorAll('.kss-opt').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.kss-opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); picked=parseInt(b.dataset.v,10);
      document.getElementById('b-kss-confirm').disabled=false;
    });
    document.getElementById('b-kss-confirm').onclick=()=>{ st.value=picked; log('KSS '+picked); completeStep(i); };
  }
  if(step.t==='pvt') wirePVT(i, st);
  if(step.t==='vigil') wireVigil(i, st, step);
}

function completeStep(i){
  const step=STEPS[i], st=S.steps[i];
  if(step.profile){
    const summary=finalizeEngine(i);
    if(summary) st.value=summary;
    stopEngineFor(i);
  }
  st.status='done'; st.endedAt=nowISO(); if(!st.startedAt) st.startedAt=st.endedAt;
  if(i+1<S.steps.length){ S.current=i+1; S.steps[i+1].status='current'; } else { S.current=S.steps.length; stopTicker(); }
  save(); render();
}

function startTicker(){
  if(tickHandle) return;
  tickHandle=setInterval(()=>{
    updateElapsed();
    const i=S.current, step=STEPS[i], st=S.steps[i];
    if(step && step.t==='timer' && st.running){
      st.remaining=Math.max(0, st.remaining-1);
      const disp=document.getElementById('t-display'); if(disp) disp.textContent=fmtClock(st.remaining);
      if(st.remaining<=0){ st.running=false; try{ navigator.vibrate && navigator.vibrate(200); }catch(e){} log(step.title+' reached target'); completeStep(i); }
      else save();
    }
  },1000);
}
function stopTicker(){ if(tickHandle){ clearInterval(tickHandle); tickHandle=null; } }

function wirePVT(i, st){
  const state={running:true, trials:[], armed:false, waitingSince:0, timeoutId:null, deadline:performance.now()+STEPS[i].dur*1000};
  const flash=document.getElementById('pvt-flash');
  function stats(){
    const rts=state.trials.filter(t=>t.rt!=null).map(t=>t.rt).sort((a,b)=>a-b);
    const med=rts.length?rts[Math.floor(rts.length/2)]:null;
    const lapses=state.trials.filter(t=>t.rt!=null&&t.rt>500).length;
    const fs=state.trials.filter(t=>t.falseStart).length;
    document.getElementById('pvt-n').textContent=state.trials.length;
    document.getElementById('pvt-med').textContent=med!=null?med+'ms':'—';
    document.getElementById('pvt-lap').textContent=lapses;
    document.getElementById('pvt-fs').textContent=fs;
    return {medianRT:med, lapses, falseStarts:fs, n:state.trials.length};
  }
  function scheduleNext(){
    flash.className='flash'; flash.textContent='Wait…';
    const isi=2000+Math.random()*8000;
    state.timeoutId=setTimeout(()=>{ flash.className='flash go'; flash.textContent='TAP'; state.waitingSince=performance.now(); state.armed=true; }, isi);
  }
  flash.onclick=()=>{
    if(!state.running) return;
    if(state.armed){
      const rt=Math.round(performance.now()-state.waitingSince);
      state.trials.push({rt}); state.armed=false;
      flash.className='flash'; flash.textContent=rt+' ms'; stats();
      if(performance.now()<state.deadline) setTimeout(scheduleNext,400);
    } else {
      state.trials.push({rt:null, falseStart:true});
      flash.className='flash early'; flash.textContent='Early'; stats();
      clearTimeout(state.timeoutId);
      if(performance.now()<state.deadline) setTimeout(scheduleNext,600);
    }
  };
  if(!st.startedAt) st.startedAt=nowISO();
  log('PVT started automatically'); scheduleNext();
  const endCheck=setInterval(()=>{
    if(performance.now()>=state.deadline){
      clearInterval(endCheck); state.running=false; clearTimeout(state.timeoutId);
      const s=stats(); S.steps[i].value=s;
      log('PVT finished automatically — median '+(s.medianRT!=null?s.medianRT+'ms':'—')+', '+s.lapses+' lapse(s)');
      completeStep(i);
    }
  },500);
}

function renderDoneList(){
  const host=document.getElementById('donelist');
  const rows=STEPS.map((s,i)=>({s,st:S.steps[i],i})).filter(x=>x.st.status==='done');
  if(!rows.length){ host.innerHTML=''; return; }
  host.innerHTML=rows.slice().reverse().map(({s,st})=>{
    const dur=st.startedAt&&st.endedAt?fmtClock((new Date(st.endedAt)-new Date(st.startedAt))/1000):'—';
    let extra=dur;
    if(st.value && st.value.sdlp!=null) extra=dur+' · SDLP '+st.value.sdlp;
    else if(st.value && st.value.medianRT!=null) extra=dur+' · '+st.value.medianRT+'ms';
    else if(st.value && st.value.hits!=null) extra=dur+' · '+st.value.hits+' hit(s)';
    return `<div class="dlrow"><span class="ck">✓</span><span class="nm">${esc(s.title)}</span><span class="du">${extra}</span></div>`;
  }).join('');
}
function renderLog(){
  const host=document.getElementById('log');
  if(!S.log.length){ host.innerHTML='<div class="empty">Nothing logged yet.</div>'; return; }
  host.innerHTML=S.log.slice().reverse().map(e=>{
    const d=new Date(e.at);
    const t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
    return `<div class="logline"><span class="t">${t}</span><span>${esc(e.msg)}</span></div>`;
  }).join('');
}

/* ── Demonstration ──────────────────────────────────────────
   Three quick beats at the controls: baseline, road, load —
   Figure 1 is not a picture; it is the judge. */
const BEAT_S=18;
let demoState=null;
function initDemo(){ demoState={phase:'idle', beatIndex:-1, results:[], interval:null, e:0, nextPert:0, elapsed:0}; }
function renderDemo(){
  if(!demoState) initDemo();
  const host=document.getElementById('otherview');
  const beats=[{name:'Baseline', profile:'baseline'},{name:'Road', profile:'road'},{name:'Load', profile:'load'}];
  if(demoState.phase==='idle'){
    host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="d-back">←</button><h2>Demonstration</h2></div>
      <div class="blurb">Three beats at the controls. Figure 1 is not a picture; it is the judge.</div>
      <div class="btnrow"><button class="primary" id="d-start">Start</button></div>`;
    document.getElementById('d-back').onclick=goMain;
    document.getElementById('d-start').onclick=()=>startBeat(0, beats);
    return;
  }
  if(demoState.phase==='running'){
    const b=beats[demoState.beatIndex];
    host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="d-back">←</button><h2>Demonstration</h2></div>
      <div class="beatlabel">BEAT ${demoState.beatIndex+1} OF 3 · ${b.name.toUpperCase()}</div>
      <div class="trackwrap"><canvas id="demo-canvas" height="90"></canvas></div>
      <div class="btnrow holdrow"><button class="hold" id="dh-left">◀</button><button class="hold" id="dh-right">▶</button></div>
      <div class="timerbig" id="d-display">${fmtClock(BEAT_S-demoState.elapsed)}</div>
      <div class="btnrow"><button class="ghost" id="d-skip">Skip beat</button></div>`;
    document.getElementById('d-back').onclick=goMain;
    document.getElementById('d-skip').onclick=()=>finishBeat(beats);
    const dhL=document.getElementById('dh-left'), dhR=document.getElementById('dh-right');
    const down=d=>e=>{ e.preventDefault(); holdDir[d]=true; }, up=d=>()=>{ holdDir[d]=false; };
    ['pointerdown','touchstart'].forEach(ev=>dhL.addEventListener(ev, down('left'), {passive:false}));
    ['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>dhL.addEventListener(ev, up('left')));
    ['pointerdown','touchstart'].forEach(ev=>dhR.addEventListener(ev, down('right'), {passive:false}));
    ['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>dhR.addEventListener(ev, up('right')));
    drawDot(document.getElementById('demo-canvas'), demoState.e);
    return;
  }
  if(demoState.phase==='finished'){
    host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="d-back">←</button><h2>Demonstration</h2></div>
      <div class="trackwrap" style="padding:8px"><canvas id="fig-canvas" height="140"></canvas></div>
      <div class="figlegend">
        <span><i style="background:${cssvar('--c-block')}"></i>Baseline</span>
        <span><i style="background:${cssvar('--c-probe')}"></i>Road</span>
        <span><i style="background:${cssvar('--c-assess')}"></i>Load</span>
      </div>
      <div class="caption">Same wobble amplitude, different shape. Figure 1 is not a picture; it is the judge.</div>
      <div class="btnrow" style="margin-top:14px"><button class="primary" id="d-again">Run again</button><button class="ghost" id="d-back2">Back</button></div>`;
    document.getElementById('d-back').onclick=goMain;
    document.getElementById('d-back2').onclick=goMain;
    document.getElementById('d-again').onclick=()=>{ initDemo(); renderDemo(); };
    drawFigure1(document.getElementById('fig-canvas'), demoState.results);
    return;
  }
}
function startBeat(idx, beats){
  const p=PROFILES[beats[idx].profile];
  demoState.phase='running'; demoState.beatIndex=idx; demoState.e=0; demoState.elapsed=0;
  demoState.nextPert=p.pertMin+Math.random()*(p.pertMax-p.pertMin);
  demoState.samples=[];
  renderDemo();
  demoState.interval=setInterval(()=>{
    const dt=0.05;
    const n=(Math.random()+Math.random()+Math.random()-1.5);
    demoState.e += n*p.noiseSD;
    if(p.road) demoState.e += (Math.random()-0.5)*p.roadExtra;
    if(holdDir.left) demoState.e -= p.corrRate*dt;
    if(holdDir.right) demoState.e += p.corrRate*dt;
    if(p.pert){ demoState.nextPert-=dt; if(demoState.nextPert<=0){ const sgn=Math.random()<0.5?-1:1; demoState.e+=sgn*p.pertAmt; demoState.nextPert=p.pertMin+Math.random()*(p.pertMax-p.pertMin); } }
    demoState.e=Math.max(-3,Math.min(3,demoState.e));
    demoState.elapsed+=dt;
    demoState.samples.push(demoState.e);
    const disp=document.getElementById('d-display'); if(disp) disp.textContent=fmtClock(BEAT_S-demoState.elapsed);
    drawDot(document.getElementById('demo-canvas'), demoState.e);
    if(demoState.elapsed>=BEAT_S) finishBeat(beats);
  },50);
}
function finishBeat(beats){
  if(demoState.interval){ clearInterval(demoState.interval); demoState.interval=null; }
  const samples=demoState.samples||[];
  const step=Math.max(1, Math.floor(samples.length/140));
  const trace=[]; for(let k=0;k<samples.length;k+=step) trace.push(samples[k]);
  demoState.results.push({name:beats[demoState.beatIndex].name, trace});
  if(demoState.beatIndex+1<beats.length) startBeat(demoState.beatIndex+1, beats);
  else { demoState.phase='finished'; renderDemo(); }
}
function drawFigure1(canvas, results){
  if(!canvas || !results.length) return;
  const w=canvas.clientWidth||300, h=140;
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const colors={Baseline:cssvar('--c-block'), Road:cssvar('--c-probe'), Load:cssvar('--c-assess')};
  ctx.strokeStyle=cssvar('--card3'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
  results.forEach(r=>{
    if(!r.trace.length) return;
    ctx.beginPath(); ctx.strokeStyle=colors[r.name]||'#888'; ctx.lineWidth=2;
    r.trace.forEach((v,idx)=>{
      const x=(idx/(r.trace.length-1))*w, y=h/2 - (v/3)*(h/2-10);
      idx===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
}

/* ── Trace: analyze previous records (this console's .json, or the
   original desktop app's summary.csv / windows.csv) ───────────── */
let analyzeData=[];   // per-block SDLP rows, from .json or summary.csv
let traceSeries=[];   // induction time-series, from windows.csv
function loadAnalyzeData(){
  try{ const raw=localStorage.getItem('sh_analyze_v1'); if(raw) analyzeData=JSON.parse(raw); }catch(e){ analyzeData=[]; }
  try{ const raw2=localStorage.getItem('sh_trace_v1'); if(raw2) traceSeries=JSON.parse(raw2); }catch(e){ traceSeries=[]; }
}
function saveAnalyzeData(){
  try{ localStorage.setItem('sh_analyze_v1', JSON.stringify(analyzeData)); }catch(e){}
  try{ localStorage.setItem('sh_trace_v1', JSON.stringify(traceSeries)); }catch(e){}
}
function condName(title){
  if(title==='Baseline'||title==='Fatigued Baseline') return 'Baseline';
  if(title==='Road Condition'||title==='Fatigued Road') return 'Road';
  if(title==='Cognitive Load') return 'Load';
  return null;
}
/* the original desktop app's condition codes (CONDS in that build) */
const CSV_COND = {BASE:['Baseline','pre'], ROAD:['Road','pre'], LOAD:['Load','pre'],
  BASE_L:['Baseline','post'], ROAD_L:['Road','post']};

function parseSessionIntoAnalyze(rec){
  if(!rec || !Array.isArray(rec.steps) || rec.steps.length!==STEPS.length) return 0;
  let added=0;
  STEPS.forEach((step,idx)=>{
    const st=rec.steps[idx];
    const c=condName(step.title);
    if(c && st && st.value && st.value.sdlp!=null){
      analyzeData.push({code:rec.code||'—', condition:c, phase:step.title.startsWith('Fatigued')?'post':'pre', sdlp:st.value.sdlp});
      added++;
    }
  });
  return added;
}
/* minimal quoted-CSV line splitter */
function splitCSVLine(line){
  const out=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){ if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=c; }
    else { if(c==='"') inQ=true; else if(c===','){ out.push(cur); cur=''; } else cur+=c; }
  }
  out.push(cur); return out;
}
function parseCSVRows(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.length);
  if(lines.length<2) return {header:[], rows:[]};
  const header=splitCSVLine(lines[0]);
  const rows=lines.slice(1).map(l=>{
    const cells=splitCSVLine(l), o={};
    header.forEach((h,i)=>o[h]=cells[i]);
    return o;
  });
  return {header, rows};
}
/* returns {addedRows, addedTrace} */
function parseCSVIntoAnalyze(text){
  const trimmed=text.trim();
  if(trimmed==='no induction recorded') return {addedRows:0, addedTrace:0, note:'That file recorded no induction — nothing to trace.'};
  const {header, rows}=parseCSVRows(text);
  let addedRows=0, addedTrace=0;
  if(header.includes('sdlp_premise')){
    rows.forEach(r=>{
      const map=CSV_COND[r.condition];
      const sdlp=parseFloat(r.sdlp_premise);
      if(map && isFinite(sdlp)){ analyzeData.push({code:r.participant||'—', condition:map[0], phase:map[1], sdlp}); addedRows++; }
    });
  } else if(header.includes('window_type')){
    const byCode={};
    rows.filter(r=>r.window_type==='1min').forEach(r=>{
      const t=parseFloat(r.t_start_s), v=parseFloat(r.sdlp);
      if(!isFinite(t)||!isFinite(v)) return;
      const code=r.participant||'—';
      (byCode[code]=byCode[code]||[]).push({t, sdlp:v});
    });
    Object.keys(byCode).forEach(code=>{
      traceSeries.push({code, points:byCode[code].sort((a,b)=>a.t-b.t)});
      addedTrace++;
    });
  }
  return {addedRows, addedTrace};
}
function drawTraceChart(canvas, series){
  const w=canvas.clientWidth||300, h=140;
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const allPts=series.flatMap(s=>s.points);
  if(!allPts.length) return;
  const maxT=Math.max(...allPts.map(p=>p.t)), maxV=Math.max(0.05, ...allPts.map(p=>p.sdlp));
  const palette=[cssvar('--c-block'), cssvar('--c-probe'), cssvar('--c-assess'), cssvar('--c-break'), cssvar('--c-flow')];
  ctx.strokeStyle=cssvar('--card3'); ctx.beginPath(); ctx.moveTo(0,h-10); ctx.lineTo(w,h-10); ctx.stroke();
  series.forEach((s,si)=>{
    if(!s.points.length) return;
    ctx.beginPath(); ctx.strokeStyle=palette[si%palette.length]; ctx.lineWidth=2;
    s.points.forEach((p,idx)=>{
      const x=(p.t/maxT)*w, y=(h-14) - (p.sdlp/maxV)*(h-24);
      idx===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
}
function renderAnalyze(){
  loadAnalyzeData();
  const host=document.getElementById('otherview');
  const summary=['Baseline','Road','Load'].map(c=>{
    const pre=analyzeData.filter(d=>d.condition===c&&d.phase==='pre').map(d=>d.sdlp);
    const post=analyzeData.filter(d=>d.condition===c&&d.phase==='post').map(d=>d.sdlp);
    const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    return {c, pre:avg(pre), post:avg(post), preN:pre.length, postN:post.length};
  });
  const maxVal=Math.max(0.05, ...summary.flatMap(s=>[s.pre,s.post]).filter(v=>v!=null));
  const colorFor={Baseline:cssvar('--c-block'), Road:cssvar('--c-probe'), Load:cssvar('--c-assess')};
  const bars=summary.map(s=>`
    <div class="barrow"><div class="lbl"><span>${s.c} · alert${s.preN?' ('+s.preN+')':''}</span><span>${s.pre!=null?s.pre.toFixed(3):'—'}</span></div>
      <div class="bartrack"><div class="barfill" style="width:${s.pre!=null?(s.pre/maxVal*100):0}%; background:${colorFor[s.c]}"></div></div></div>
    <div class="barrow"><div class="lbl"><span>${s.c} · fatigued${s.postN?' ('+s.postN+')':''}</span><span>${s.post!=null?s.post.toFixed(3):'—'}</span></div>
      <div class="bartrack"><div class="barfill" style="width:${s.post!=null?(s.post/maxVal*100):0}%; background:${colorFor[s.c]}; opacity:.55"></div></div></div>`).join('');
  const rows=analyzeData.map(d=>`<tr><td>${esc(d.code)}</td><td>${d.condition}</td><td>${d.phase==='post'?'fatigued':'alert'}</td><td>${d.sdlp}</td></tr>`).join('');
  const traceLegend=traceSeries.map((s,i)=>{
    const palette=['--c-block','--c-probe','--c-assess','--c-break','--c-flow'];
    return `<span><i style="background:${cssvar(palette[i%palette.length])}"></i>${esc(s.code)}</span>`;
  }).join('');
  host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="a-back">←</button><h2>Trace</h2></div>
    <div class="blurb">Load session files — this console's .json, or the desktop app's summary.csv / windows.csv — to see the actual wobble trace and compare conditions.</div>
    <div class="btnrow" style="margin-bottom:16px"><button class="primary" id="a-load">Load files</button><button class="ghost" id="a-clear">Clear</button></div>
    ${traceSeries.length?`<div class="barcard"><h3>Induction SDLP trace (1-min windows)</h3>
      <div class="trackwrap" style="padding:8px"><canvas id="trace-canvas" height="140"></canvas></div>
      <div class="figlegend">${traceLegend}</div></div>`:''}
    <div class="barcard"><h3>Average SDLP by condition</h3>${analyzeData.length?bars:'<div class="empty">No records loaded yet.</div>'}</div>
    ${analyzeData.length?`<div class="barcard"><h3>Records</h3><div class="tablewrap"><table><thead><tr><th>Code</th><th>Condition</th><th>Phase</th><th>SDLP</th></tr></thead><tbody>${rows}</tbody></table></div></div>`:''}`;
  document.getElementById('a-back').onclick=goMain;
  document.getElementById('a-clear').onclick=()=>{ analyzeData=[]; traceSeries=[]; saveAnalyzeData(); renderAnalyze(); };
  document.getElementById('a-load').onclick=()=>document.getElementById('analyze-file').click();
  if(traceSeries.length) drawTraceChart(document.getElementById('trace-canvas'), traceSeries);
}

document.getElementById('analyze-file').onchange=e=>{
  const files=Array.from(e.target.files||[]);
  let done=0;
  if(!files.length) return;
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=()=>{

        else parseSessionIntoAnalyze(JSON.parse(reader.result));

      done++;
      if(done===files.length){ saveAnalyzeData(); renderAnalyze(); }
    };
    reader.readAsText(f);
  });
  e.target.value='';
};

load();
if(S.steps[S.current] && S.steps[S.current].status==='locked') S.steps[S.current].status='current';
if(S.startedAt) startTicker();
renderApp();
</script>
